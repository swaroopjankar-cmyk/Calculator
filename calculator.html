<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            padding: 24px;
            color: #e8fbff;
            background:
                radial-gradient(ellipse at 18% 18%, rgba(35, 213, 230, 0.22), transparent 38%),
                radial-gradient(ellipse at 82% 82%, rgba(22, 111, 230, 0.25), transparent 42%),
                linear-gradient(145deg, #071522, #0b2538 52%, #071728);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        .calculator {
            width: min(100%, 360px);
            padding: 24px;
            border: 1px solid rgba(187, 242, 255, 0.2);
            border-radius: 30px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.045));
            box-shadow:
                0 28px 70px rgba(0, 8, 24, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(24px);
            backdrop-filter: blur(24px);
        }

        #display {
            width: 100%;
            height: 76px;
            margin: 0 0 18px;
            padding: 12px 16px;
            border: 1px solid rgba(188, 240, 255, 0.12);
            border-radius: 18px;
            outline: none;
            background: rgba(3, 17, 30, 0.42);
            color: #effcff;
            font: 300 36px/1 "Segoe UI", Arial, sans-serif;
            text-align: right;
            box-shadow: inset 0 3px 12px rgba(0, 0, 0, 0.2);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        button {
            min-width: 0;
            height: 58px;
            border: 1px solid rgba(204, 245, 255, 0.16);
            border-radius: 18px;
            background: linear-gradient(150deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.065));
            color: #e6faff;
            font: 500 20px/1 "Segoe UI", Arial, sans-serif;
            cursor: pointer;
            box-shadow:
                0 7px 0 rgba(2, 13, 25, 0.38),
                0 10px 20px rgba(0, 0, 0, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.16);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
        }

        button:hover {
            transform: translateY(-3px);
            border-color: rgba(104, 225, 255, 0.72);
            background: linear-gradient(145deg, rgba(54, 203, 235, 0.35), rgba(64, 139, 255, 0.2));
            box-shadow:
                0 9px 0 rgba(2, 13, 25, 0.32),
                0 0 24px rgba(34, 190, 255, 0.42),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        button:active {
            transform: translateY(3px) scale(0.97);
            box-shadow: 0 2px 0 rgba(2, 13, 25, 0.38), 0 0 14px rgba(34, 190, 255, 0.3);
        }

        button:focus-visible {
            outline: 2px solid #78eaff;
            outline-offset: 3px;
        }

        button.utility {
            color: #83eaff;
        }

        button.operator {
            background: linear-gradient(145deg, rgba(23, 174, 207, 0.32), rgba(37, 111, 195, 0.2));
            color: #a4f0ff;
        }

        button.equals {
            border-color: rgba(112, 235, 255, 0.5);
            background: linear-gradient(145deg, rgba(41, 204, 226, 0.75), rgba(38, 135, 226, 0.72));
            color: #fff;
        }

        button.equals:hover {
            background: linear-gradient(145deg, rgba(69, 225, 244, 0.9), rgba(59, 152, 245, 0.88));
            box-shadow: 0 9px 0 rgba(2, 13, 25, 0.32), 0 0 30px rgba(34, 190, 255, 0.62);
        }

        button.zero {
            grid-column: span 2;
        }

        @media (max-width: 380px) {
            .calculator {
                padding: 18px;
                border-radius: 26px;
            }

            .buttons {
                gap: 10px;
            }

            button {
                height: 54px;
                border-radius: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            button {
                transition: none;
            }
        }
    </style>

</head>

<body>

    <div class="calculator">

        <input type="text" id="display" inputmode="decimal" aria-label="Calculator display">

        <div class="buttons">

            <button class="utility" onclick="clearDisplay()">C</button>
            <button class="utility" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="appendValue('%')">%</button>
            <button class="operator" onclick="appendValue('/')">/</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">*</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button class="zero" onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

    </div>

    <script>

        let display = document.getElementById("display");

        display.addEventListener("keydown", function(event) {
            if (event.ctrlKey || event.metaKey || event.altKey) {
                return;
            }

            const allowedKeys = ["Backspace", "Delete", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End", "Tab", "Enter", "Escape"];
            if (event.key.length === 1 && !/[0-9+\-*/%().\s]/.test(event.key) || event.key.length !== 1 && !allowedKeys.includes(event.key)) {
                event.preventDefault();
                return;
            }

            if (event.key.length === 1) {
                const start = display.selectionStart;
                const end = display.selectionEnd;
                const candidate = display.value.slice(0, start) + event.key + display.value.slice(end);
                if (sanitizeExpression(candidate) !== candidate) {
                    event.preventDefault();
                }
            }
        });

        display.addEventListener("input", function() {
            const cursor = display.selectionStart;
            const sanitizedValue = sanitizeExpression(display.value);

            if (display.value !== sanitizedValue) {
                display.value = sanitizedValue;
                const nextCursor = sanitizeExpression(display.value.slice(0, cursor)).length;
                display.setSelectionRange(nextCursor, nextCursor);
            }
        });

        display.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                calculate();
            } else if (event.key === "Escape") {
                clearDisplay();
            }
        });

        function appendValue(value) {
            const candidate = display.value + value;
            if (sanitizeExpression(candidate) === candidate) {
                display.value = candidate;
            }
        }

        function sanitizeExpression(expression) {
            let sanitized = "";
            let digitsInNumber = 0;

            for (const character of expression) {
                if (/[0-9]/.test(character)) {
                    if (digitsInNumber < 15) {
                        sanitized += character;
                        digitsInNumber++;
                    }
                } else if (/[+\-*/%()\s]/.test(character)) {
                    sanitized += character;
                    digitsInNumber = 0;
                } else if (character === ".") {
                    sanitized += character;
                }
            }

            return sanitized;
        }

        function clearDisplay() {
            display.value = "";
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            if (!display.value.trim()) {
                return;
            }

            try {
                display.value = evaluateExpression(display.value);
            }
            catch {
                display.value = "Error";
            }
        }

        function evaluateExpression(expression) {
            let position = 0;

            function skipWhitespace() {
                while (/\s/.test(expression[position] || "")) {
                    position++;
                }
            }

            function parseExpression() {
                let value = parseTerm();

                while (true) {
                    skipWhitespace();
                    const operator = expression[position];
                    if (operator !== "+" && operator !== "-") {
                        return value;
                    }

                    position++;
                    const nextValue = parseTerm();
                    value = operator === "+" ? value + nextValue : value - nextValue;
                }
            }

            function parseTerm() {
                let value = parseUnary();

                while (true) {
                    skipWhitespace();
                    const operator = expression[position];
                    if (operator !== "*" && operator !== "/" && operator !== "%") {
                        return value;
                    }

                    position++;
                    const nextValue = parseUnary();
                    if (operator === "*") {
                        value *= nextValue;
                    } else if (operator === "/") {
                        value /= nextValue;
                    } else {
                        value %= nextValue;
                    }
                }
            }

            function parseUnary() {
                skipWhitespace();
                if (expression[position] === "+") {
                    position++;
                    return parseUnary();
                }
                if (expression[position] === "-") {
                    position++;
                    return -parseUnary();
                }
                return parsePrimary();
            }

            function parsePrimary() {
                skipWhitespace();
                if (expression[position] === "(") {
                    position++;
                    const value = parseExpression();
                    skipWhitespace();
                    if (expression[position] !== ")") {
                        throw new Error("Unmatched parenthesis");
                    }
                    position++;
                    return value;
                }

                const match = expression.slice(position).match(/^(?:\d+\.?\d*|\.\d+)/);
                if (!match) {
                    throw new Error("Expected a number");
                }
                position += match[0].length;
                return Number(match[0]);
            }

            const result = parseExpression();
            skipWhitespace();
            if (position !== expression.length || !Number.isFinite(result)) {
                throw new Error("Invalid expression");
            }
            return result;
        }

    </script>

</body>
</html>
